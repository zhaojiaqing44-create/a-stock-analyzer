<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI驱动的A股数据分析平台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1923; color: #e4e6eb; }
        .header { background: linear-gradient(135deg, #1a2a3a 0%, #0f1923 100%); padding: 24px 32px; border-bottom: 1px solid #2a3a4a; }
        .header h1 { font-size: 24px; font-weight: 600; background: linear-gradient(90deg, #4facfe, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #8a9ba8; margin-top: 6px; font-size: 14px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #2a3a4a; }
        .tab { padding: 12px 24px; cursor: pointer; border-bottom: 2px solid transparent; color: #8a9ba8; transition: all 0.2s; }
        .tab.active { color: #4facfe; border-bottom-color: #4facfe; }
        .tab:hover { color: #e4e6eb; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #1a2a3a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a3a4a; }
        .card h3 { font-size: 16px; margin-bottom: 16px; color: #4facfe; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: #8a9ba8; }
        select, input { background: #0f1923; border: 1px solid #2a3a4a; color: #e4e6eb; padding: 8px 12px; border-radius: 6px; font-size: 14px; min-width: 140px; }
        button { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0f1923; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .chart { width: 100%; height: 400px; margin-top: 16px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
        .stat-box { background: #0f1923; padding: 16px; border-radius: 8px; border: 1px solid #2a3a4a; }
        .stat-label { font-size: 12px; color: #8a9ba8; }
        .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
        .stat-value.positive { color: #00d68f; }
        .stat-value.negative { color: #ff4757; }
        .ai-box { background: #0f1923; padding: 20px; border-radius: 8px; border-left: 3px solid #4facfe; margin-top: 16px; line-height: 1.8; font-size: 15px; }
        .loading { color: #8a9ba8; padding: 20px; text-align: center; }
        .table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .table th, .table td { padding: 10px; text-align: left; border-bottom: 1px solid #2a3a4a; }
        .table th { color: #8a9ba8; font-weight: 500; font-size: 13px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .badge-green { background: rgba(0,214,143,0.15); color: #00d68f; }
        .badge-red { background: rgba(255,71,87,0.15); color: #ff4757; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI驱动的A股数据分析平台</h1>
        <p>数据可视化 · 短期反转效应回测 · AI智能解读</p>
    </div>
    <div class="container">
        <div class="tabs">
            <div class="tab active" data-tab="kline">股票K线图</div>
            <div class="tab" data-tab="backtest">反转效应回测</div>
            <div class="tab" data-tab="ai">AI智能解读</div>
        </div>

        <!-- K线图 -->
        <div class="tab-content active" id="tab-kline">
            <div class="card">
                <h3>股票K线数据</h3>
                <div class="controls">
                    <div class="control-group">
                        <label>选择股票</label>
                        <select id="stockSelect"></select>
                    </div>
                    <div class="control-group">
                        <label>开始日期</label>
                        <input type="date" id="startDate" value="2023-01-01">
                    </div>
                    <div class="control-group">
                        <label>结束日期</label>
                        <input type="date" id="endDate" value="2024-12-31">
                    </div>
                    <button onclick="loadKline()">查询</button>
                </div>
                <div id="klineChart" class="chart"></div>
                <div class="stats" id="klineStats"></div>
            </div>
        </div>

        <!-- 回测 -->
        <div class="tab-content" id="tab-backtest">
            <div class="card">
                <h3>短期反转效应回测</h3>
                <div class="controls">
                    <div class="control-group">
                        <label>股票池（逗号分隔代码）</label>
                        <input type="text" id="btCodes" value="000001,600519,000858,601318,600036,000333,600276,002594" style="width:300px">
                    </div>
                    <div class="control-group">
                        <label>回溯天数</label>
                        <input type="number" id="lookback" value="5" min="1" max="60">
                    </div>
                    <div class="control-group">
                        <label>持有天数</label>
                        <input type="number" id="hold" value="5" min="1" max="60">
                    </div>
                    <div class="control-group">
                        <label>分组数</label>
                        <input type="number" id="groups" value="5" min="2" max="10">
                    </div>
                    <button onclick="runBacktest()">开始回测</button>
                </div>
                <div id="btChart" class="chart"></div>
                <div class="stats" id="btStats"></div>
            </div>
        </div>

        <!-- AI解读 -->
        <div class="tab-content" id="tab-ai">
            <div class="card">
                <h3>AI个股智能分析</h3>
                <div class="controls">
                    <div class="control-group">
                        <label>选择股票</label>
                        <select id="aiStockSelect"></select>
                    </div>
                    <div class="control-group">
                        <label>API Key（可选，留空使用本地分析）</label>
                        <input type="text" id="apiKey" placeholder="DeepSeek API Key" style="width:300px">
                    </div>
                    <button onclick="runAIAnalyze()">AI分析</button>
                </div>
                <div id="aiResult"></div>
            </div>
        </div>
    </div>

    <script>
        let klineChart = echarts.init(document.getElementById('klineChart'));
        let btChart = echarts.init(document.getElementById('btChart'));
        let stockList = [];

        // Tab切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                setTimeout(() => {
                    klineChart.resize();
                    btChart.resize();
                }, 100);
            };
        });

        // 加载股票列表
        async function loadStocks() {
            const res = await fetch('/api/stocks');
            stockList = await res.json();
            const html = stockList.map(s => `<option value="${s.code}">${s.code} ${s.name}</option>`).join('');
            document.getElementById('stockSelect').innerHTML = html;
            document.getElementById('aiStockSelect').innerHTML = html;
        }

        // K线图
        async function loadKline() {
            const code = document.getElementById('stockSelect').value;
            const start = document.getElementById('startDate').value.replace(/-/g, '');
            const end = document.getElementById('endDate').value.replace(/-/g, '');
            const res = await fetch(`/api/stock/${code}?start_date=${start}&end_date=${end}`);
            const data = await res.json();
            if (data.detail) { alert(data.detail); return; }

            const dates = data.dates;
            const kdata = data.open.map((o, i) => [o, data.close[i], data.low[i], data.high[i]]);

            const option = {
                backgroundColor: 'transparent',
                title: { text: `${code} K线图`, left: 'center', textStyle: {color: '#e4e6eb'} },
                tooltip: { trigger: 'axis' },
                grid: { left: '10%', right: '5%', bottom: '15%' },
                xAxis: { type: 'category', data: dates, axisLine: {lineStyle: {color: '#2a3a4a'}}, axisLabel: {color: '#8a9ba8'} },
                yAxis: { scale: true, axisLine: {lineStyle: {color: '#2a3a4a'}}, axisLabel: {color: '#8a9ba8'}, splitLine: {lineStyle: {color: '#1a2a3a'}} },
                dataZoom: [{ type: 'inside', start: 60, end: 100 }, { type: 'slider', start: 60, end: 100, height: 20, bottom: 10 }],
                series: [{
                    type: 'candlestick',
                    data: kdata,
                    itemStyle: { color: '#00d68f', color0: '#ff4757', borderColor: '#00d68f', borderColor0: '#ff4757' }
                }]
            };
            klineChart.setOption(option);

            // 统计
            const closes = data.close;
            const change = ((closes[closes.length-1] - closes[0]) / closes[0] * 100).toFixed(2);
            const high = Math.max(...data.high).toFixed(2);
            const low = Math.min(...data.low).toFixed(2);
            document.getElementById('klineStats').innerHTML = `
                <div class="stat-box"><div class="stat-label">区间涨跌幅</div><div class="stat-value ${change>=0?'positive':'negative'}">${change}%</div></div>
                <div class="stat-box"><div class="stat-label">区间最高价</div><div class="stat-value">${high}</div></div>
                <div class="stat-box"><div class="stat-label">区间最低价</div><div class="stat-value">${low}</div></div>
                <div class="stat-box"><div class="stat-label">交易天数</div><div class="stat-value">${closes.length}</div></div>
            `;
        }

        // 回测
        async function runBacktest() {
            const codes = document.getElementById('btCodes').value.split(',').map(c => c.trim()).filter(Boolean);
            const start = '20230101';
            const end = '20241231';
            const lookback = parseInt(document.getElementById('lookback').value);
            const hold = parseInt(document.getElementById('hold').value);
            const groups = parseInt(document.getElementById('groups').value);

            document.getElementById('btStats').innerHTML = '<div class="loading">回测中，大约需要10-30秒...</div>';

            const res = await fetch('/api/backtest', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({codes, start_date: start, end_date: end, lookback_days: lookback, hold_days: hold, n_groups: groups})
            });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }

            // 多空收益曲线
            const dates = data.dates;
            const lsReturns = data.long_short_returns || [];
            const cumulative = [];
            let cum = 1;
            lsReturns.forEach(r => { cum *= (1 + r); cumulative.push(cum.toFixed(4)); });

            const series = [];
            for (let g = 1; g <= groups; g++) {
                const rets = data.group_mean_returns[`group_${g}`] || [];
                let c = 1;
                const cumRets = rets.map(r => { c *= (1 + r); return c.toFixed(4); });
                series.push({
                    name: `第${g}组`,
                    type: 'line',
                    data: cumRets,
                    smooth: true,
                    symbol: 'none',
                });
            }
            series.push({
                name: '多空组合',
                type: 'line',
                data: cumulative,
                smooth: true,
                lineStyle: {width: 3, color: '#4facfe'},
                symbol: 'none',
            });

            const option = {
                backgroundColor: 'transparent',
                title: { text: '分组累计净值曲线', left: 'center', textStyle: {color: '#e4e6eb'} },
                tooltip: { trigger: 'axis' },
                legend: { data: series.map(s => s.name), top: 30, textStyle: {color: '#8a9ba8'} },
                grid: { left: '10%', right: '5%', bottom: '10%', top: '20%' },
                xAxis: { type: 'category', data: dates, axisLine: {lineStyle: {color: '#2a3a4a'}}, axisLabel: {color: '#8a9ba8'} },
                yAxis: { scale: true, axisLine: {lineStyle: {color: '#2a3a4a'}}, axisLabel: {color: '#8a9ba8'}, splitLine: {lineStyle: {color: '#1a2a3a'}} },
                series: series
            };
            btChart.setOption(option);

            // 统计
            const s = data.summary;
            const lsMean = (s.long_short_mean * 100).toFixed(3);
            const lsT = s.long_short_tstat.toFixed(3);
            const lsSharpe = s.long_short_sharpe.toFixed(3);
            document.getElementById('btStats').innerHTML = `
                <div class="stat-box"><div class="stat-label">多空组合平均收益(%)</div><div class="stat-value ${lsMean>=0?'positive':'negative'}">${lsMean}</div></div>
                <div class="stat-box"><div class="stat-label">t统计量</div><div class="stat-value">${lsT}</div></div>
                <div class="stat-box"><div class="stat-label">年化夏普比率</div><div class="stat-value">${lsSharpe}</div></div>
                <div class="stat-box"><div class="stat-label">调仓次数</div><div class="stat-value">${dates.length}</div></div>
            `;
        }

        // AI分析
        async function runAIAnalyze() {
            const select = document.getElementById('aiStockSelect');
            const code = select.value;
            const name = select.options[select.selectedIndex].text.split(' ')[1] || code;
            const apiKey = document.getElementById('apiKey').value;
            const provider = apiKey ? 'deepseek' : 'mock';

            document.getElementById('aiResult').innerHTML = '<div class="loading">AI分析中...</div>';

            const res = await fetch('/api/ai/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code, stock_name: name, api_key: apiKey, provider})
            });
            const data = await res.json();

            const d = data.data || {};
            let statsHtml = '';
            if (d.close) {
                statsHtml = `
                    <div class="stats" style="margin-bottom:16px">
                        <div class="stat-box"><div class="stat-label">最新收盘价</div><div class="stat-value">${d.close}</div></div>
                        <div class="stat-box"><div class="stat-label">近5日涨跌幅</div><div class="stat-value ${d.change_5d>=0?'positive':'negative'}">${d.change_5d}%</div></div>
                        <div class="stat-box"><div class="stat-label">近20日涨跌幅</div><div class="stat-value ${d.change_20d>=0?'positive':'negative'}">${d.change_20d}%</div></div>
                        <div class="stat-box"><div class="stat-label">成交量趋势</div><div class="stat-value">${d.volume_trend}</div></div>
                    </div>
                `;
            }
            document.getElementById('aiResult').innerHTML = statsHtml + `<div class="ai-box">${data.insight}</div>`;
        }

        loadStocks();
        window.addEventListener('resize', () => { klineChart.resize(); btChart.resize(); });
    </script>
</body>
</html>
