<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股数据分析平台 v2.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
}
:root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --border: #e1e8ed;
    --primary: #3498db;
    --up: #e74c3c;
    --down: #27ae60;
    --accent: #8e44ad;
}
[data-theme="dark"] {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #e8e8e8;
    --text-secondary: #a0a0b0;
    --border: #2a2a4a;
    --primary: #5dade2;
    --up: #ff6b6b;
    --down: #51cf66;
    --accent: #bb8fce;
}
.header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.header h1 { font-size: 20px; font-weight: 600; }
.header-right { display: flex; gap: 12px; align-items: center; }
.theme-toggle {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.tab {
    padding: 10px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}
.tab:hover { border-color: var(--primary); }
.tab.active { background: var(--primary); color: white; border-color: var(--primary); }
.panel { display: none; }
.panel.active { display: block; }
.card {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.card h2 { font-size: 18px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
select, input, button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
}
button { cursor: pointer; background: var(--primary); color: white; border: none; }
button:hover { opacity: 0.9; }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.chart { width: 100%; height: 400px; }
.chart-sm { width: 100%; height: 250px; }
.stat {
    padding: 16px;
    background: var(--bg);
    border-radius: 8px;
    text-align: center;
}
.stat-value { font-size: 28px; font-weight: 700; margin: 8px 0; }
.stat-label { font-size: 12px; color: var(--text-secondary); }
.up { color: var(--up); }
.down { color: var(--down); }
.tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    background: var(--bg);
    margin-right: 4px;
}
.loading {
    text-align: center;
    padding: 40px;
    color: var(--text-secondary);
}
.chat-box {
    height: 300px;
    overflow-y: auto;
    padding: 12px;
    background: var(--bg);
    border-radius: 8px;
    margin-bottom: 12px;
}
.chat-msg { margin-bottom: 12px; }
.chat-msg.user { text-align: right; }
.chat-msg .bubble {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 12px;
    max-width: 80%;
    word-wrap: break-word;
}
.chat-msg.user .bubble { background: var(--primary); color: white; }
.chat-msg.ai .bubble { background: var(--card); border: 1px solid var(--border); }
.chat-input { display: flex; gap: 8px; }
.chat-input input { flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--bg); font-weight: 600; }
@media (max-width: 768px) {
    .container { padding: 10px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>

<div class="header">
    <h1>📈 A股数据分析平台 v2.0</h1>
    <div class="header-right">
        <select id="apiKeyInput" placeholder="DeepSeek API Key（可选）">
            <option value="">无API Key（Mock模式）</option>
        </select>
        <input type="password" id="apiKey" placeholder="输入DeepSeek API Key" style="width:200px">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 暗色模式</button>
    </div>
</div>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('market')">市场概览</div>
        <div class="tab" onclick="switchTab('stock')">个股分析</div>
        <div class="tab" onclick="switchTab('backtest')">回测研究</div>
        <div class="tab" onclick="switchTab('ai')">AI智能</div>
        <div class="tab" onclick="switchTab('portfolio')">自选组合</div>
    </div>

    <!-- 市场概览 -->
    <div id="panel-market" class="panel active">
        <div class="grid grid-4" id="indexStats"></div>
        <div class="card">
            <h2>主要指数走势</h2>
            <div id="indexChart" class="chart"></div>
        </div>
        <div class="card">
            <h2>市场情绪</h2>
            <div id="sentimentBox"></div>
        </div>
    </div>

    <!-- 个股分析 -->
    <div id="panel-stock" class="panel">
        <div class="card">
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
                <select id="stockSelect"></select>
                <input type="date" id="startDate" value="2024-01-01">
                <input type="date" id="endDate" value="2024-12-31">
                <button onclick="loadStock()">查询</button>
            </div>
            <div id="stockStats" class="grid grid-4"></div>
        </div>
        <div class="grid grid-2">
            <div class="card">
                <h2>K线 + 均线</h2>
                <div id="klineChart" class="chart"></div>
            </div>
            <div class="card">
                <h2>成交量</h2>
                <div id="volumeChart" class="chart"></div>
            </div>
        </div>
        <div class="grid grid-2">
            <div class="card">
                <h2>MACD</h2>
                <div id="macdChart" class="chart-sm"></div>
            </div>
            <div class="card">
                <h2>RSI</h2>
                <div id="rsiChart" class="chart-sm"></div>
            </div>
        </div>
        <div class="grid grid-2">
            <div class="card">
                <h2>KDJ</h2>
                <div id="kdjChart" class="chart-sm"></div>
            </div>
            <div class="card">
                <h2>布林带</h2>
                <div id="bollChart" class="chart-sm"></div>
            </div>
        </div>
    </div>

    <!-- 回测研究 -->
    <div id="panel-backtest" class="panel">
        <div class="card">
            <h2>短期反转效应回测</h2>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
                <input type="date" id="btStart" value="2024-01-01">
                <input type="date" id="btEnd" value="2024-12-31">
                <select id="btHold">
                    <option value="1">持有1天</option>
                    <option value="5" selected>持有5天</option>
                    <option value="10">持有10天</option>
                    <option value="20">持有20天</option>
                </select>
                <button onclick="runBacktest()">运行回测</button>
            </div>
            <div id="backtestResult"></div>
        </div>
        <div class="card">
            <h2>Fama-MacBeth截面回归</h2>
            <button onclick="runFamaMacbeth()">运行回归</button>
            <div id="fmResult" style="margin-top:16px"></div>
        </div>
        <div class="card">
            <h2>多因子分组回测</h2>
            <button onclick="runMultiFactor()">运行多因子</button>
            <div id="mfResult" style="margin-top:16px"></div>
        </div>
    </div>

    <!-- AI智能 -->
    <div id="panel-ai" class="panel">
        <div class="grid grid-2">
            <div class="card">
                <h2>AI个股分析</h2>
                <select id="aiStockSelect"></select>
                <button onclick="aiAnalyze()" style="margin-left:8px">分析</button>
                <div id="aiAnalysis" style="margin-top:16px"></div>
            </div>
            <div class="card">
                <h2>AI市场问答</h2>
                <div class="chat-box" id="chatBox"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="问我关于A股的问题..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button onclick="sendChat()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 自选组合 -->
    <div id="panel-portfolio" class="panel">
        <div class="card">
            <h2>我的自选股</h2>
            <div style="margin-bottom:12px">
                <select id="addStockSelect"></select>
                <button onclick="addWatchlist()">添加</button>
            </div>
            <table id="watchlistTable">
                <thead><tr><th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let charts = {};
let stockData = null;
let watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');

// 初始化
async function init() {
    await loadStocks();
    await loadIndices();
    loadSentiment();
    if (watchlist.length) renderWatchlist();
}

function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? '' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️ 亮色模式' : '🌙 暗色模式';
    Object.values(charts).forEach(c => c && c.dispose());
    charts = {};
    if (stockData) renderStockCharts();
}
if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.querySelector('.theme-toggle').textContent = '☀️ 亮色模式';
}

function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
    setTimeout(() => { Object.values(charts).forEach(c => c && c.resize()); }, 100);
}

async function loadStocks() {
    const res = await fetch('/api/stocks');
    const stocks = await res.json();
    const opts = stocks.map(s => `<option value="${s.code}">${s.name} (${s.code})</option>`).join('');
    ['stockSelect', 'aiStockSelect', 'addStockSelect'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = opts;
    });
}

async function loadIndices() {
    const res = await fetch('/api/indices');
    const indices = await res.json();
    let statsHtml = '';
    indices.forEach(idx => {
        statsHtml += `<div class="stat"><div class="stat-label">${idx.name}</div><div class="stat-value" id="idx-${idx.symbol}">--</div></div>`;
    });
    document.getElementById('indexStats').innerHTML = statsHtml;

    const chart = echarts.init(document.getElementById('indexChart'));
    charts.index = chart;
    const series = [];
    for (const idx of indices) {
        const r = await fetch(`/api/index/${idx.symbol}?start_date=20240101&end_date=20241231`);
        const d = await r.json();
        const last = d.close[d.close.length - 1];
        document.getElementById('idx-' + idx.symbol).textContent = last.toFixed(2);
        series.push({ name: idx.name, type: 'line', data: d.close, smooth: true, symbol: 'none' });
    }
    chart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { top: 0 },
        grid: { top: 40, left: 50, right: 20, bottom: 30 },
        xAxis: { type: 'category', data: series[0]?.data?.map((_,i) => i) || [] },
        yAxis: { type: 'value', scale: true },
        series
    });
}

async function loadSentiment() {
    const res = await fetch('/api/ai/sentiment');
    const s = await res.json();
    const color = s.sentiment_score > 0.5 ? 'var(--up)' : (s.sentiment_score < 0.4 ? 'var(--down)' : 'var(--text-secondary)');
    document.getElementById('sentimentBox').innerHTML = `
        <div class="grid grid-3">
            <div class="stat"><div class="stat-label">情绪评分</div><div class="stat-value" style="color:${color}">${(s.sentiment_score*100).toFixed(0)}</div></div>
            <div class="stat"><div class="stat-label">情绪标签</div><div class="stat-value">${s.sentiment_label}</div></div>
            <div class="stat"><div class="stat-label">恐惧贪婪指数</div><div class="stat-value">${s.indicators.fear_greed_index}</div></div>
        </div>
        <p style="margin-top:16px;color:var(--text-secondary)">${s.description}</p>
    `;
}

async function loadStock() {
    const code = document.getElementById('stockSelect').value;
    const start = document.getElementById('startDate').value.replace(/-/g, '');
    const end = document.getElementById('endDate').value.replace(/-/g, '');
    const res = await fetch(`/api/stock/${code}?start_date=${start}&end_date=${end}`);
    stockData = await res.json();
    renderStockStats();
    renderStockCharts();
}

function renderStockStats() {
    const d = stockData;
    const last = d.close[d.close.length - 1];
    const prev = d.close[d.close.length - 2] || last;
    const change = ((last - prev) / prev * 100);
    const high5 = Math.max(...d.close.slice(-5));
    const low5 = Math.min(...d.close.slice(-5));
    document.getElementById('stockStats').innerHTML = `
        <div class="stat"><div class="stat-label">最新价</div><div class="stat-value">${last.toFixed(2)}</div></div>
        <div class="stat"><div class="stat-label">涨跌幅</div><div class="stat-value ${change >= 0 ? 'up' : 'down'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</div></div>
        <div class="stat"><div class="stat-label">5日最高</div><div class="stat-value">${high5.toFixed(2)}</div></div>
        <div class="stat"><div class="stat-label">5日最低</div><div class="stat-value">${low5.toFixed(2)}</div></div>
    `;
}

function renderStockCharts() {
    const d = stockData;
    const dates = d.dates;
    const kdata = d.close.map((_, i) => [d.open[i], d.close[i], d.low[i], d.high[i]]);

    const kline = echarts.init(document.getElementById('klineChart'));
    charts.kline = kline;
    kline.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['K线', 'MA5', 'MA10', 'MA20'], top: 0 },
        grid: { top: 40, left: 50, right: 20, bottom: 30 },
        xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45 } },
        yAxis: { type: 'value', scale: true },
        dataZoom: [{ type: 'inside' }, { type: 'slider' }],
        series: [
            { name: 'K线', type: 'candlestick', data: kdata },
            { name: 'MA5', type: 'line', data: d.indicators.ma5, smooth: true, symbol: 'none' },
            { name: 'MA10', type: 'line', data: d.indicators.ma10, smooth: true, symbol: 'none' },
            { name: 'MA20', type: 'line', data: d.indicators.ma20, smooth: true, symbol: 'none' },
        ]
    });

    const vol = echarts.init(document.getElementById('volumeChart'));
    charts.volume = vol;
    vol.setOption({
        tooltip: { trigger: 'axis' },
        grid: { top: 20, left: 50, right: 20, bottom: 30 },
        xAxis: { type: 'category', data: dates },
        yAxis: { type: 'value' },
        series: [{ type: 'bar', data: d.volume, itemStyle: { color: '#3498db' } }]
    });

    const macd = echarts.init(document.getElementById('macdChart'));
    charts.macd = macd;
    macd.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['DIF', 'DEA', 'MACD'], top: 0 },
        grid: { top: 30, left: 50, right: 20, bottom: 20 },
        xAxis: { type: 'category', data: dates },
        yAxis: { type: 'value' },
        series: [
            { name: 'DIF', type: 'line', data: d.indicators.dif, symbol: 'none' },
            { name: 'DEA', type: 'line', data: d.indicators.dea, symbol: 'none' },
            { name: 'MACD', type: 'bar', data: d.indicators.macd.map(v => [v >= 0 ? '#e74c3c' : '#27ae60', v]) },
        ]
    });

    const rsi = echarts.init(document.getElementById('rsiChart'));
    charts.rsi = rsi;
    rsi.setOption({
        tooltip: { trigger: 'axis' },
        grid: { top: 20, left: 50, right: 20, bottom: 20 },
        xAxis: { type: 'category', data: dates },
        yAxis: { type: 'value', min: 0, max: 100 },
        series: [
            { type: 'line', data: d.indicators.rsi, symbol: 'none', lineStyle: { color: '#8e44ad' } },
            { type: 'line', data: dates.map(() => 70), symbol: 'none', lineStyle: { type: 'dashed', color: '#e74c3c' } },
            { type: 'line', data: dates.map(() => 30), symbol: 'none', lineStyle: { type: 'dashed', color: '#27ae60' } },
        ]
    });

    const kdj = echarts.init(document.getElementById('kdjChart'));
    charts.kdj = kdj;
    kdj.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['K', 'D', 'J'], top: 0 },
        grid: { top: 30, left: 50, right: 20, bottom: 20 },
        xAxis: { type: 'category', data: dates },
        yAxis: { type: 'value' },
        series: [
            { name: 'K', type: 'line', data: d.indicators.k, symbol: 'none' },
            { name: 'D', type: 'line', data: d.indicators.d, symbol: 'none' },
            { name: 'J', type: 'line', data: d.indicators.j, symbol: 'none' },
        ]
    });

    const boll = echarts.init(document.getElementById('bollChart'));
    charts.boll = boll;
    boll.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['收盘价', '上轨', '中轨', '下轨'], top: 0 },
        grid: { top: 30, left: 50, right: 20, bottom: 20 },
        xAxis: { type: 'category', data: dates },
        yAxis: { type: 'value', scale: true },
        series: [
            { name: '收盘价', type: 'line', data: d.close, symbol: 'none' },
            { name: '上轨', type: 'line', data: d.indicators.boll_upper, symbol: 'none', lineStyle: { type: 'dashed' } },
            { name: '中轨', type: 'line', data: d.indicators.boll_mid, symbol: 'none' },
            { name: '下轨', type: 'line', data: d.indicators.boll_lower, symbol: 'none', lineStyle: { type: 'dashed' } },
        ]
    });
}

async function runBacktest() {
    const start = document.getElementById('btStart').value.replace(/-/g, '');
    const end = document.getElementById('btEnd').value.replace(/-/g, '');
    const hold = document.getElementById('btHold').value;
    document.getElementById('backtestResult').innerHTML = '<div class="loading">回测中，请稍候（可能需要1-2分钟）...</div>';
    const res = await fetch('/api/backtest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ start_date: start, end_date: end, hold_days: parseInt(hold) })
    });
    const r = await res.json();
    if (r.error) {
        document.getElementById('backtestResult').innerHTML = `<p style="color:var(--up)">${r.error}</p>`;
        return;
    }
    document.getElementById('backtestResult').innerHTML = `
        <div class="grid grid-4">
            <div class="stat"><div class="stat-label">多空组合收益</div><div class="stat-value ${r.annual_return >= 0 ? 'up' : 'down'}">${(r.annual_return*100).toFixed(2)}%</div></div>
            <div class="stat"><div class="stat-label">夏普比率</div><div class="stat-value">${r.sharpe_ratio.toFixed(2)}</div></div>
            <div class="stat"><div class="stat-label">最大回撤</div><div class="stat-value down">${(r.max_drawdown*100).toFixed(2)}%</div></div>
            <div class="stat"><div class="stat-label">t统计量</div><div class="stat-value">${r.t_statistic.toFixed(2)}</div></div>
        </div>
        <p style="margin-top:16px;color:var(--text-secondary)">${r.interpretation || ''}</p>
    `;
}

async function runFamaMacbeth() {
    document.getElementById('fmResult').innerHTML = '<div class="loading">回归计算中...</div>';
    const res = await fetch('/api/fama-macbeth');
    const r = await res.json();
    if (r.error) {
        document.getElementById('fmResult').innerHTML = `<p style="color:var(--up)">${r.error}</p>`;
        return;
    }
    document.getElementById('fmResult').innerHTML = `
        <div class="grid grid-3">
            <div class="stat"><div class="stat-label">回归系数β</div><div class="stat-value">${r.mean_beta.toFixed(4)}</div></div>
            <div class="stat"><div class="stat-label">t统计量</div><div class="stat-value">${r.t_statistic.toFixed(2)}</div></div>
            <div class="stat"><div class="stat-label">p值</div><div class="stat-value">${r.p_value.toFixed(4)}</div></div>
        </div>
        <p style="margin-top:16px">${r.interpretation}</p>
    `;
}

async function runMultiFactor() {
    document.getElementById('mfResult').innerHTML = '<div class="loading">多因子回测中...</div>';
    const res = await fetch('/api/multi-factor');
    const r = await res.json();
    let html = '<table><thead><tr><th>因子</th><th>平均收益</th><th>t统计</th><th>夏普</th><th>期数</th></tr></thead><tbody>';
    for (const [f, v] of Object.entries(r.factors || {})) {
        html += `<tr><td>${f}</td><td class="${v.mean_return >= 0 ? 'up' : 'down'}">${(v.mean_return*100).toFixed(2)}%</td><td>${v.t_stat.toFixed(2)}</td><td>${v.sharpe.toFixed(2)}</td><td>${v.n_periods}</td></tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('mfResult').innerHTML = html;
}

function getApiKey() { return document.getElementById('apiKey').value || null; }

async function aiAnalyze() {
    const code = document.getElementById('aiStockSelect').value;
    const name = document.getElementById('aiStockSelect').selectedOptions[0].text;
    document.getElementById('aiAnalysis').innerHTML = '<div class="loading">AI分析中...</div>';
    const res = await fetch('/api/ai/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, stock_name: name, api_key: getApiKey() || '', provider: 'deepseek' })
    });
    const r = await res.json();
    document.getElementById('aiAnalysis').innerHTML = `
        ${r.data ? `<div class="grid grid-3">
            <div class="stat"><div class="stat-label">收盘价</div><div class="stat-value">${r.data.close}</div></div>
            <div class="stat"><div class="stat-label">5日涨跌</div><div class="stat-value">${r.data.change_5d}%</div></div>
            <div class="stat"><div class="stat-label">20日涨跌</div><div class="stat-value">${r.data.change_20d}%</div></div>
        </div>` : ''}
        <div style="margin-top:16px;padding:16px;background:var(--bg);border-radius:8px;line-height:1.8">${r.insight}</div>
    `;
}

function sendChat() {
    const input = document.getElementById('chatInput');
    const q = input.value.trim();
    if (!q) return;
    const box = document.getElementById('chatBox');
    box.innerHTML += `<div class="chat-msg user"><div class="bubble">${q}</div></div>`;
    input.value = '';
    fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, api_key: getApiKey() || '' })
    }).then(r => r.json()).then(r => {
        box.innerHTML += `<div class="chat-msg ai"><div class="bubble">${r.answer}</div></div>`;
        box.scrollTop = box.scrollHeight;
    });
}

function addWatchlist() {
    const select = document.getElementById('addStockSelect');
    const code = select.value;
    const name = select.selectedOptions[0].text;
    if (!watchlist.find(w => w.code === code)) {
        watchlist.push({ code, name });
        localStorage.setItem('watchlist', JSON.stringify(watchlist));
        renderWatchlist();
    }
}

function removeWatchlist(code) {
    watchlist = watchlist.filter(w => w.code !== code);
    localStorage.setItem('watchlist', JSON.stringify(watchlist));
    renderWatchlist();
}

async function renderWatchlist() {
    const tbody = document.querySelector('#watchlistTable tbody');
    let html = '';
    for (const w of watchlist) {
        try {
            const res = await fetch(`/api/stock/${w.code}?start_date=20240101&end_date=20241231`);
            const d = await res.json();
            const last = d.close[d.close.length - 1];
            const prev = d.close[d.close.length - 2] || last;
            const chg = ((last - prev) / prev * 100).toFixed(2);
            html += `<tr><td>${w.code}</td><td>${w.name}</td><td>${last.toFixed(2)}</td><td class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg}%</td><td><button onclick="removeWatchlist('${w.code}')">删除</button></td></tr>`;
        } catch(e) {
            html += `<tr><td>${w.code}</td><td>${w.name}</td><td colspan="3">获取失败</td></tr>`;
        }
    }
    tbody.innerHTML = html;
}

init();
</script>
